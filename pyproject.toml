[project]
name = "tf-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M Karthick", email = "827302+mkartic@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "daytona>=0.218.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
]

[project.scripts]
tf-hackathon = "tf_hackathon:main"
acme-app = "tf_hackathon.acme_app.server:main"
skillsmith = "tf_hackathon.skillsmith.server:main"
setup-trueforge = "tf_hackathon.setup_trueforge:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
